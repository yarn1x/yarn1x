name: Generate Snake

on:
  schedule:
    # Запуск каждые 12 часов
    - cron: "0 */12 * * *"
  # Позволяет запустить генерацию вручную в любой момент
  workflow_dispatch:
  # Запуск при каждом пуше в ветку main
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Генерирует змейку на основе графика контрибуций
      - name: generate-github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Пушит сгенерированные SVG-файлы в ветку output
      - name: push github-contribution-grid-snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
